spring:
    config:
        import: optional:file:.env[.properties]
    application:
        name: ${SPRING_APPLICATION_NAME}
    mail: 
        host: ${SPRING_MAIL_HOST}
        port: ${SPRING_MAIL_PORT} 
        username: ${SPRING_MAIL_USERNAME} 
        password: ${SPRING_MAIL_PASSWORD} 
        properties: 
            mail: 
                smtp: 
                    auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH} 
                    starttls:
                        enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE} 
    jpa: 
        properties: 
            hibernate: 
                format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
        hibernate: 
            ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO} 
        show-sql: ${SPRING_JPA_SHOW_SQL}
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

server: 
    port: ${SERVER_PORT}

paystack:
    secret-key: ${PAYSTACK_SECRET}
    base-url: ${PAYSTACK_BASE_URL}
app:
    jwtSecret: ${APP_JWT_SECRET}
    jwtExpirationMs: ${APP_JWT_EXPIRATION_MS}

cloudinary:
    cloud_name: ${CLOUDINARY_CLOUD_NAME}
    api_key: ${CLOUDINARY_API_KEY}
    api_secret: ${CLOUDINARY_API_SECRET}

adminEmail: ${ADMIN_EMAIL}


